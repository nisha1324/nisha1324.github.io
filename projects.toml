[[project]]
slug = "llm-review-categoriser"
title = "LLM Review Categoriser"
kind = "Applied AI / text analytics"
finished = "2026-10-08"
question = "Which themes (battery, call quality, durability, service…) drive negative product reviews, so a product team knows what to fix first?"
stat = "1 in 11"
stat_label = "negative reviews (46 of 497) say the product doesn't work, broke or died"
finding = "990 reviews are sorted into 9 business themes (a Claude backend plus an offline keyword baseline, 63.3% accurate on a hand-labelled sample), then split into concrete sub-issues. Only 13 of the 46 'doesn't work' reviews land in the durability theme, and charger faults are almost as common as short battery life (17 vs 19)."
so_what = "A theme dashboard alone hides product failure. Track it as its own KPI across themes, and fix charger compatibility in listings."
stack = ["Python", "LLM API (Claude)", "pandas", "evaluation vs gold sample"]
data = "UCI Sentiment Labelled Sentences (CC BY 4.0)"
