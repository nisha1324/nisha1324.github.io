[[project]]
slug = "vic-rental-market-analysis"
title = "Victorian Rental Market Analysis"
kind = "Housing market & affordability analysis"
finished = "2026-10-26"
question = "Where are rents in Victoria rising fastest, who can still afford to rent, and how has that changed since before COVID?"
stat = "36.4%"
stat_label = "of new leases in regional Victoria were affordable to a lower-income household in Sep 2025, down from 46.8% in Sep 2019"
finding = "DuckDB SQL over 25 years of Homes Victoria rental-bond data, joined to ABS inflation, building approvals and Census dwellings, after an audit that reconciles the parsed tables with the published report. The median new lease rose from $400 to $550 a week since Sep 2019 (+11.5% after inflation), but fell 0.7% in real terms in the last year. Regional Victoria rose 46.9% against Melbourne's 36.9%, and affordability clearly fell in 13 of 20 well-sampled regional LGAs against 4 of 31 in Melbourne. Where more homes were built, rents rose less (median 36.5% against 47.5%)."
so_what = "Aim rent support and social housing at regional cities and single-parent households first, keep the growth corridors building, and budget 2026 rent reviews on flat real rents."
stack = ["SQL", "DuckDB", "Python", "pandas", "ABS Data API"]
data = "Homes Victoria Rental Report – Quarterly; ABS CPI, Building Approvals and Census 2021 (all CC BY 4.0)"
data_url = "https://discover.data.vic.gov.au/dataset/rental-report-quarterly-moving-annual-rents-by-suburb"
chart = "results/charts/rent_growth_vs_affordability.png"
chart_commit = "a1aa7f616c92614ccc1eff9ceb25df4eddb47899"
chart_alt = "Scatter chart with one dot per Victorian LGA: change in the median weekly rent of new leases from Sep 2019 to Sep 2025 against the change in the share of new leases affordable to a lower-income household. Where rents rose about 30%, as in Mitchell, Ballarat, Melton and Wyndham, the affordable share rose by 14 to 29 points. Where rents rose 61 to 70%, in the regional LGAs of Latrobe, Greater Shepparton, Wodonga and Moira, it fell by 27 to 42 points."

[[project]]
slug = "llm-sql-report-helper"
title = "LLM SQL Report Helper"
kind = "Applied AI & governed self-service analytics"
finished = "2026-10-24"
question = "Can managers safely ask a database business questions in plain English, and how would we know whether the answers are right?"
stat = "38%"
stat_label = "of the offline path's numbers were right on reworded questions, against 90% on the wording it was built from"
finding = "Plain-English questions become guarded SQL and a short report. Personal data and writes are blocked inside SQLite, so the guard rejects all 5 naive privacy and write queries however the model behaves. Any backend is scored on 32 questions with gold answers plus the same questions reworded: the offline semantic layer gets 59% right on its own wording and 19% reworded. A number check on the summaries refused 788 of 788 planted changes to money and percentage figures. The Claude backend is built and tested, and its score is pending an API key."
so_what = "Enforce data access in the database rather than the prompt, gate every model or prompt change on a held-out score, and always show the result table under a generated summary."
stack = ["SQL", "SQLite", "Python", "Claude API", "LLM evaluation"]
data = "Chinook sample database (MIT-style licence)"
data_url = "https://github.com/lerocha/chinook-database"
chart = "results/charts/eval_offline.png"
chart_commit = "c1601f011b446013339f3f63c5e24a7bc8370443"
chart_alt = "Stacked bar chart of the offline path's answers to 32 business questions, asked in the wording it was built from and reworded. Overall: 19 right, 2 wrong and 11 with no answer on its own wording; 6 right, 10 wrong and 16 with no answer reworded. By level, easy goes from 7 of 8 to 4 of 8 right, medium from 10 of 15 to 2 of 15, and hard from 2 of 9 to 0 of 9."

[[project]]
slug = "data-quality-pipeline-duckdb"
title = "Data-Quality Pipeline on DuckDB"
kind = "Data-quality testing & pipelines"
finished = "2026-10-21"
question = "Which foot-traffic reports built on Melbourne's live pedestrian-sensor feed can the business trust today, and which need a caveat or shouldn't be used?"
stat = "3 of 7"
stat_label = "common foot-traffic reports shouldn't be used as usually built (snapshot 2026-10-18)"
finding = "dbt-style checks written from scratch (YAML compiled to SQL on DuckDB) find that 8.30% of rows share their id with another sensor and 5.67% of sensor-hours are missing, 43.0% of them likely zeros the feed doesn't publish. Year-on-year growth is +3.8% on the published totals but +6.2% like-for-like. A daily GitHub Actions gate reruns everything and goes red only on errors nobody has reviewed."
so_what = "Show the last complete day instead of 'yesterday', compare periods like-for-like with a coverage column, and join on sensor and date, never the published id."
stack = ["SQL", "DuckDB", "Python", "YAML data tests", "GitHub Actions"]
data = "City of Melbourne Pedestrian Counting System (CC BY 4.0)"
data_url = "https://data.melbourne.vic.gov.au/explore/dataset/pedestrian-counting-system-monthly-counts-per-hour/information/"
chart = "results/charts/03_monthly_undercount.png"
chart_commit = "f791449aa12c173fcf32fa501a8969960df3cc99"
chart_alt = "Bar chart of the estimated share of pedestrians missing from each month's city-wide total because of sensor outages, October 2024 to October 2026. Most months are 0.20–1.51% short; November 2025 to June 2026 are 2.58–4.06% short, while Bourke Street Mall (North) was dark."

[[project]]
slug = "marketing-lead-funnel"
title = "Marketing Lead Funnel Analysis"
kind = "Marketing & sales funnel analysis"
finished = "2026-10-18"
question = "Which marketing channels bring a marketplace sellers who sign and then actually sell, and why did conversion fall in May 2018?"
stat = "43.1%"
stat_label = "of signed sellers made a sale within 90 days of signing"
finding = "DuckDB SQL over 8,000 Olist leads, joined to ~99k marketplace orders: 11.3% of Jan–May 2018 leads signed within 90 days, so roughly 49 in 1,000 leads became a selling seller. Paid and organic search sign leads at the same rate, but paid-search sellers start selling more often (55.0% vs 39.1%). May's fall (12.1% → 8.4%) came from weaker conversion within channels, not a worse lead mix."
so_what = "Measure the funnel to the first sale, not the signature: check every seller with no sale by day 30, and give manufacturers and offline businesses, who sign but rarely sell, an onboarding path."
stack = ["SQL", "DuckDB", "Python", "Wilson intervals", "shift-share analysis"]
data = "Olist Marketing Funnel + Brazilian E-commerce (CC BY-NC-SA 4.0)"
data_url = "https://www.kaggle.com/datasets/olistbr/marketing-funnel-olist"
chart = "results/charts/08_time_to_first_sale.png"
chart_commit = "87e74f0a67a1938931f5636c6cefb4e698a0e862"
chart_alt = "Bar chart of the share of 643 signed sellers with a first sale, by days after the deal: 2.0% by day 7, 6.4% by day 14, 16.8% by day 30, 24.7% by day 45, 31.7% by day 60 and 43.1% by day 90. 48.4% had no sale by 2018-08-21."

