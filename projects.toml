[[project]]
slug = "austender-procurement-spend"
title = "AusTender Procurement Spend"
kind = "Procurement spend & compliance analytics"
finished = "2026-11-06"
question = "Where does Australian Government contract spend go, how dependent is it on a few suppliers, and do the competition and reporting rules hold up?"
stat = "$4.17bn"
stat_label = "of large-category spend (7.5%) is concentrated beyond one contract. Far more, $19.11bn of common services, is bought by 20 or more agencies from long supplier tails"
finding = "Spend, competition and compliance analytics in DuckDB SQL and Python on 59,464 contract notices first published in FY2024-25, from the official AusTender API, with every report rerun by GitHub Actions on each push. A dashboard built straight from the feed would mislead: summing every row overstates value 2.6 times, and three in four limited tenders are under the $80k line, where an open approach isn't required. Once that is fixed, 58 of 16,242 suppliers hold half of the $62.21bn committed. Only 54 of the 8,687 limited tenders from $80k cite no allowed reason, values bunch just under $80k (2.31 times the neighbouring bins) but not to avoid competition, and 51.6% of late notices come out in catch-up batches. Of $990.2m coded to Education and Training, 54.6% is programs delivered to the public, and 40.4% of notices say too little for anyone to place."
so_what = "Supplier dependence isn't the main risk; fragmentation is. Check how much of the common spend already goes through panels and pool the rest, test whether the stated reason fits for the $5.80bn of extensions and sole sources, report on current value rather than value at award, and sign 1 July renewals before they start."
stack = ["SQL", "DuckDB", "Python", "pandas", "REST API", "LLM categoriser", "GitHub Actions"]
data = "AusTender OCDS API, Department of Finance (CC BY 3.0 AU)"
data_url = "https://github.com/austender/austender-ocds-api"
chart = "results/charts/04_family_concentration.png"
chart_commit = "b022f303a5fc4a0da0abc358acbb942f6595f322"
chart_alt = "Paired horizontal bar chart for the 20 largest UNSPSC families: the top supplier's share of each family's committed value, and the share held by that supplier's single largest notice. In most families the two bars are almost the same length, so the top supplier's share rests on one contract: communications devices 80% and 80%, aircraft 60% and 59%, business administration 41% and 41%. Fuels (82% against 45%) and light weapons and ammunition (58% against 26%) are concentrated beyond one contract. Computer services, $5.69bn, has a top supplier share of 16%."

[[project]]
slug = "purchase-to-pay-process-mining"
title = "Purchase-to-Pay Process Mining"
kind = "Process mining & audit analytics"
finished = "2026-11-03"
question = "In a real purchase-to-pay process, are invoices cleared only after the right checks, where do items actually wait, and what work is redone or worth automating?"
stat = "5.0%"
stat_label = "of the mean 83.0 days from purchase order to first clearing is process overrun. 61.6% is the vendor's implied payment term and 17.1% is waiting for a payment run"
finding = "Process mining in DuckDB SQL and Python on the BPI Challenge 2019 log: 1.6 million events on 251,734 purchase items at a coatings multinational based in the Netherlands, with every report rerun by GitHub Actions on each push. Seven plausible readings of the log turn out to be wrong: summing its value field, for one, overstates it 28.6 times. 10 of 21 compliance rules had no failures, and a plain count of invoices \"cleared with no goods\" is about 8 times too high until reversed invoices are taken out. Payment blocks are behind 61.7% of overrun days, and 48.4% of blocks have no reason visible in the log. A PO price changed after the invoice affects 1,860 items holding 14.6% of value: 92.2% of those that can be timed were blocked, and they cleared 4.0 days later than comparable items."
so_what = "Don't send a team to fix invoice-to-clearing time: most of it is agreed terms and the payment-run calendar, which is a treasury decision. Fix PO prices before the invoice arrives, record a reason for every payment block, bring in e-invoicing, and ask finance whether the groups that rarely clear are settled outside this system."
stack = ["SQL", "DuckDB", "Python", "pandas", "Process mining", "GitHub Actions"]
data = "BPI Challenge 2019, 4TU.ResearchData (CC BY 4.0)"
data_url = "https://doi.org/10.4121/uuid:d06aff4b-79f0-45e6-8ec8-e19730c248f1"
chart = "results/charts/09_where_the_days_go.png"
chart_commit = "c2d74a3cb40ceeaf864ac304b02995f1a739f33f"
chart_alt = "Stacked bar chart of the mean days from purchase order to first clearing, split into four parts that add up. For all 3-way items, 83 days: 14 from PO to invoice date, 51 of implied payment term, 4 of process overrun and 14 waiting for a payment run. The main flow is the same, the invoice-after-GR flow is 81 days, and weighted by value it is 93 days, of which 52 are the implied term and 3 are overrun."

[[project]]
slug = "nem-demand-forecasting"
title = "NEM Demand Forecasting"
kind = "Forecasting for operations planning"
finished = "2026-11-01"
question = "How well can methods a planner can explain predict tomorrow's electricity demand, and how much buffer should they hold for the error that's left?"
stat = "66%"
stat_label = "of days were fully covered by a \"95%\" buffer built the usual way, on half-hours. Sizing on each day's worst half-hour and shaping it by time of day covered 94.2%"
finding = "A rolling backtest of half-hourly demand across Australia's 5 NEM regions, on AEMO data from Jan 2019 to Sep 2026, rerun by GitHub Actions on every push. Tuned on one year and scored on a held-out year (Oct 2025 – Sep 2026), a blend of smoothed recent demand and a corrected 3-year average, plus a small adjustment for forecast heat, cold and sun, reaches 3.3-8.5% day-ahead error. That's 22-45% below each region's best simple baseline and 36-55% below the usual \"same day last week\". The shaped buffer uses 3-21% less cover than a flat one, though it covered 88.6% of summer days against 97.6% of winter ones. Weather takes 8-69% off the spot cost of forecast error, yet a fixed timetable timed a battery as well or better in 4 of 5 regions."
so_what = "Replace \"same day last week\" with the blend and a weather forecast, sun included. Size buffers on each day's worst half-hour, add cover in summer, match the hedge to the region, and keep a battery on a timetable until a price forecast beats it."
stack = ["Python", "pandas", "NumPy", "DuckDB", "SQL", "GitHub Actions"]
data = "AEMO Aggregated price and demand data (any use, with attribution); ECMWF forecasts via Open-Meteo (CC BY 4.0)"
data_url = "https://aemo.com.au/energy-systems/electricity/national-electricity-market-nem/data-nem/aggregated-data"
chart = "results/charts/buffer_promise_kept.png"
chart_commit = "17b189dc58b3722ee7873d08b895cdcf53d61217"
chart_alt = "Dot chart of the share of whole days covered from Oct 2025 to Sep 2026 by day-ahead buffers with a 95% promise, for 5 regions, guarding against under-forecasts and over-forecasts. A half-hour percentile covered 53% to 73% of days. Buffers sized on each day's worst half-hour, flat or shaped by time of day, sit between about 91% and 96%, close to the 95% line."

