[[project]]
slug = "qld-emergency-department-performance"
title = "Queensland ED Performance"
kind = "Operations & service-level analysis"
finished = "2026-11-22"
question = "Where do patients wait in Queensland's public hospital emergency departments, and which hospitals should a health service look at first?"
stat = "16 of 22"
stat_label = "large hospitals slipped on 4-hour stays by more than chance could explain between Apr-Jun 2024 and Apr-Jun 2026. Those 22 hospitals handle 70.2% of attendances"
finding = "Operations analysis in pandas and DuckDB SQL on Queensland Health's quarterly emergency department data (14 quarters, 105 hospitals), with every report rerun by GitHub Actions on each push. In Apr-Jun 2026, 56.1% of ED stays were within 4 hours, down from 61% in the same quarter of 2023, although patients were being seen sooner (74.6% within the recommended time, up from 71%). A more urgent mix of patients is 37% of the two-year fall, and the rate fell in all five triage categories. Against hospitals of their own size, 35 of 104 hospitals slipped by more than chance and 12 improved, while 45 of the 57 small hospitals show no clear change. It is not only a bed problem: admitted patients are 29.0% of attendances and 45% of the within-category fall, and of the 35 hospitals slipping, 32 are slipping among patients who were not admitted. A star-schema model with 27 DAX measures carries the results into Power BI."
so_what = "Start reviews with the 12 hospitals that are below their peers and slipping, not with the bottom of a league table, and let the stream decide who is in the room: bed managers where only admitted patients are slower, the ED's own processes where only the others are. Compare each hospital with hospitals of its size, since against the state's 56.1% 20 of the 22 large hospitals are below and all 57 small hospitals are above. Do not act on one small hospital's swing: its chance bar is about ±2.9 points."
stack = ["Python", "pandas", "DuckDB", "SQL", "Power BI (DAX)", "matplotlib", "pytest", "GitHub Actions"]
data = "Emergency departments - quarterly data, Queensland Health (CC BY 4.0)"
data_url = "https://www.data.qld.gov.au/dataset/emergency-departments-quarterly-data"
chart = "results/charts/07_large_hospital_trend.png"
chart_commit = "8b25cc070901aea5ed4ad06a07fca79c4ce77302"
chart_alt = "Dot plot of the 22 large Queensland hospitals, ranked by their within-category change in ED stays within 4 hours from Apr-Jun 2024 to Apr-Jun 2026, each with a line showing its chance bar. 16 are slipping, from Queen Elizabeth II at about −8 points to Princess Alexandra at about −2; Ipswich and Cairns show no clear change; Mater Brisbane, Caboolture, Toowoomba and Queensland Children's are improving, Queensland Children's by about 9 points. Published rates are listed beside each hospital, for example Queen Elizabeth II 45.3% to 37.3% and Queensland Children's 63.2% to 70.8%."

[[project]]
slug = "new-business-survival"
title = "New-Business Survival"
kind = "Business survival analysis & SQL benchmark"
finished = "2026-11-11"
question = "Which new Australian businesses are still trading three years on, by industry, size and state, and how far can a lender trust that figure?"
stat = "49.2%"
stat_label = "of the 406,365 businesses that entered in 2022-23 were still trading at June 2026. 44.6% of non-employing entrants were, against 61.5% of employing entrants"
finding = "Survival analysis in pandas and DuckDB SQL on the ABS counts of business entries and exits (four entry cohorts, 557 local government areas), with every report rerun by GitHub Actions on each push. Survival fell in 16 of 19 industries from the 2019-20 to the 2022-23 cohort, and not because of a shift towards businesses without staff. Entrants with 1-4 employees out-survived non-employing ones in all 85 state × industry pairs where both are reliable (median gap +16.6 points). Compared at the same size mix, Accommodation and Food Services falls from 10th to 4th lowest (48.4% → 41.9%). Business numbers grew by 139,482 across LGAs, but employing businesses fell by 9,698, and 199 of the 303 LGAs lost employing businesses even though only 31 lost businesses overall."
so_what = "Lenders should price a new business on its industry and size band, not the national average: reliable national rates run from 30.3% to 70.9%, and the state adjustment moves them by −1.4 points to +6.0 points. The benchmark gives that rate for each state × industry × size band with a reliability flag that belongs in the credit file. Councils should track employing businesses, not the total count, and advisers should put support in the first year, since about half of the three-year loss happens by the first June."
stack = ["Python", "pandas", "DuckDB", "SQL", "matplotlib", "pytest", "GitHub Actions"]
data = "Counts of Australian Businesses, including Entries and Exits, Australian Bureau of Statistics (CC BY 4.0)"
data_url = "https://www.abs.gov.au/statistics/economy/business-indicators/counts-australian-businesses-including-entries-and-exits"
chart = "results/charts/07_common_size_mix.png"
chart_commit = "c1a9b97ec687135ddae333b179038b8f7ac04d95"
chart_alt = "Dot plot of the 19 industries' share of 2021-22 entrants still trading at June 2025, ranked from lowest at the national size mix. Each industry has two dots: its overall rate at its own size mix and its rate at the national size mix. Accommodation and Food Services moves furthest, dropping to 4th lowest; Transport, Postal and Warehousing rises by 3.0 points but stays 2nd lowest. Public Administration and Safety is lowest at about 35% and Agriculture, Forestry and Fishing highest at about 62%."

[[project]]
slug = "skills-demand-dashboard"
title = "Skills-Demand Dashboard"
kind = "Labour-market analysis & dashboard"
finished = "2026-11-08"
question = "Which occupations and regions are Australian employers advertising for, and is that demand rising or cooling?"
stat = "30.1%"
stat_label = "of placed job ads are now in regional Australia, up from 21.2% in 2019. Regional areas are +67.1% on 2019 against +4.9% for the capital-city regions"
finding = "Job-ad demand analysis and a Streamlit dashboard on Jobs and Skills Australia's Internet Vacancy Index (August 2026 release), with every report rerun by GitHub Actions on each push. Read naively, the files mislead: a dashboard built straight from them would show an 18% \"slump\" from October to January every year and top its fastest-growing list with noise. With 12-month averages and a 20-ad floor, ads averaged 209,655 a month, −3.3% on the year before but +21.2% on 2019, and the latest 3 months are +0.9% on a year earlier. GPs and resident medical officers added 1,362 ads a month (+36.4%), and 47.3% of ads for medical practitioners and nurses are now regional. 22 big occupations are below 2019 and still falling, among them accountants and software programmers (−46.6% on 2019). The only regions below 2019 are Canberra & ACT, Sydney and Melbourne."
