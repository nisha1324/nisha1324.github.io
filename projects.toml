chart_commit = "789c86725d106f37b4035825205044e29b5d0c74"
chart_alt = "Bar chart of the share of repeat reports for the 15 largest NYC 311 complaint types. HPD heat and hot water is highest at 53%, followed by HPD unsanitary condition and plumbing at 45%."

