[[project]]
slug = "data-quality-pipeline-duckdb"
title = "Data-Quality Pipeline on DuckDB"
kind = "Data-quality testing & pipelines"
finished = "2026-10-21"
question = "Which foot-traffic reports built on Melbourne's live pedestrian-sensor feed can the business trust today, and which need a caveat or shouldn't be used?"
stat = "3 of 7"
stat_label = "common foot-traffic reports shouldn't be used as usually built (snapshot 2026-10-18)"
finding = "dbt-style checks written from scratch (YAML compiled to SQL on DuckDB) find that 8.30% of rows share their id with another sensor and 5.67% of sensor-hours are missing, 43.0% of them likely zeros the feed doesn't publish. Year-on-year growth is +3.8% on the published totals but +6.2% like-for-like. A daily GitHub Actions gate reruns everything and goes red only on errors nobody has reviewed."
so_what = "Show the last complete day instead of 'yesterday', compare periods like-for-like with a coverage column, and join on sensor and date, never the published id."
stack = ["SQL", "DuckDB", "Python", "YAML data tests", "GitHub Actions"]
data = "City of Melbourne Pedestrian Counting System (CC BY 4.0)"
data_url = "https://data.melbourne.vic.gov.au/explore/dataset/pedestrian-counting-system-monthly-counts-per-hour/information/"
chart = "results/charts/03_monthly_undercount.png"
chart_commit = "f791449aa12c173fcf32fa501a8969960df3cc99"
chart_alt = "Bar chart of the estimated share of pedestrians missing from each month's city-wide total because of sensor outages, October 2024 to October 2026. Most months are 0.20–1.51% short; November 2025 to June 2026 are 2.58–4.06% short, while Bourke Street Mall (North) was dark."

[[project]]
slug = "marketing-lead-funnel"
title = "Marketing Lead Funnel Analysis"
kind = "Marketing & sales funnel analysis"
finished = "2026-10-18"
question = "Which marketing channels bring a marketplace sellers who sign and then actually sell, and why did conversion fall in May 2018?"
stat = "43.1%"
stat_label = "of signed sellers made a sale within 90 days of signing"
finding = "DuckDB SQL over 8,000 Olist leads, joined to ~99k marketplace orders: 11.3% of Jan–May 2018 leads signed within 90 days, so roughly 49 in 1,000 leads became a selling seller. Paid and organic search sign leads at the same rate, but paid-search sellers start selling more often (55.0% vs 39.1%). May's fall (12.1% → 8.4%) came from weaker conversion within channels, not a worse lead mix."
so_what = "Measure the funnel to the first sale, not the signature: check every seller with no sale by day 30, and give manufacturers and offline businesses, who sign but rarely sell, an onboarding path."
stack = ["SQL", "DuckDB", "Python", "Wilson intervals", "shift-share analysis"]
data = "Olist Marketing Funnel + Brazilian E-commerce (CC BY-NC-SA 4.0)"
data_url = "https://www.kaggle.com/datasets/olistbr/marketing-funnel-olist"
chart = "results/charts/08_time_to_first_sale.png"
chart_commit = "87e74f0a67a1938931f5636c6cefb4e698a0e862"
chart_alt = "Bar chart of the share of 643 signed sellers with a first sale, by days after the deal: 2.0% by day 7, 6.4% by day 14, 16.8% by day 30, 24.7% by day 45, 31.7% by day 60 and 43.1% by day 90. 48.4% had no sale by 2018-08-21."

[[project]]
slug = "data-structures-in-practice"
title = "Data Structures in Practice"
kind = "Algorithms for operations data"
finished = "2026-10-14"
question = "How many NYC 311 service requests report an issue that's already open, and where do they come from?"
stat = "16.9%"
stat_label = "of 342,390 tickets in March 2026 repeated an issue that was still open at the same building"
finding = "A hash-map check finds 97.5% of the housing agency's (HPD) own heat duplicate flags and covers the month in 0.23 s, against about 1.4 hours for the naive scan. Matching nearby tickets within 100 m finds 66.8% of the water agency's (DEP) duplicate flags, against 23.3% by exact address."
so_what = "A repeat check at intake, plus distinct-issue counts next to ticket counts, keeps queues and dashboards from counting the same problem many times."
stack = ["Python", "hash maps", "heaps", "sweep line", "union-find", "numpy / scipy"]
